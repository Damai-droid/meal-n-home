{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center">

    <div class="card shadow-sm border-0 p-5" style="max-width:550px; width:100%; border-radius:30px;">

        <h1 class="text-center mb-2">Create Account ✨</h1>
        <p class="text-center text-muted mb-5">
            Daftar untuk mulai pesan meal kit favoritmu
        </p>

        <form method="POST">
            {% csrf_token %}

            <!-- Username -->
            <div class="mb-4">
                <label class="form-label fw-bold">Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Masukkan username"
                       required>
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label class="form-label fw-bold">Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Masukkan email"
                       required>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Masukkan password"
                       required>
            </div>

            <!-- Konfirmasi Password -->
            <div class="mb-4">
                <label class="form-label fw-bold">Konfirmasi Password</label>
                <input type="password"
                       name="confirm_password"
                       class="form-control"
                       placeholder="Ulangi password"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100 py-3 rounded-pill fw-bold">
                Register
            </button>

        </form>

        <p class="text-center mt-4 mb-0">
            Sudah punya akun?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

</div>
{% endblock %}
